  "https://www.github.com/mos3abof",
  "https://fosstodon.org/@mos3abof",
  "https://www.linkedin.com/in/mosab",
  "https://twitter.com/mos3abof",
  "https://www.youtube.com/@mos3abof13",
  "https://www.instagram.com/mos3abof",
  "https://www.facebook.com/mos3abof",
]

[extra.footer]
# The feed is among the social icons (partials/social-icons.html).
feed_link = false

[extra.footer.links]
en = [
  { name = "Talks", url = "@/talks/index.md" },
]
