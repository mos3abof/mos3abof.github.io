text = "عزيزي محمد مصطفى ... اللي جرحني في تعليقك كلمة \"بلا تضييق وحجر\"..<br /><br />لأني من أكتر الناس اللي بيكرهوهم، زي ما أنت قلت أنا سايب الباب مفتوح للجميع علشان أنا بأحترم حرية الآخر في إبداء رأيه.. مع إني عارف (بكل تأكيد) بخاصية الرقابة على التعليقات وبكل الخاصيات الأخرى لأن شغلتي أصلا مبرمج ومطور مواقع انترنت ومهتم جدا بكل جديد في المجال..<br /><br />ومع ذلك .. أرجع وأوضح لك نقطة صغيرة .. أنا ما قلتش حاجة وحشة على ناس بعينهم، أو ما وجهتش كلامي للمعلقين من الأساس في التعليق اللي أنت بتتكلم عليه..<br /><br />كل اللي كنت باعمله ساعتها (ومش عارف ده واضح لك وللا لا) بأهون على صاحبي من تأثير تعليقات \"متخلفة\" عليه... وأعتذر لو كلمة \"تعليقات\" فيها إساءة أدب يعني!<br /><br />وبرضه أرجع أفكرك للمرة الخمس تلاف ... أنا ما بأتكلمش على حد بعينه وما غلطش في حد بعينه...<br /><br />وظاهرة التعليقات المتخلفة موجودة شئنا أم أبينا... أتمنى بس إنها ما تحرقش دمي ولا دم الناس اللي بأحبهم كتير...<br /><br />اتمنى تكون الصورة وضحتلك<br /><br />وأشكرك جدا على شجاعتك واعتذارك..."

