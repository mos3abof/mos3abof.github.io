text = "أعتذر لو كنت جرحتك أو سببت ليك أي إزعاج..وبغض النظر عن رأيي في إن تعليقي مكنش من النوع الجارح..<br /><br />ولو في تحفظ على بعض الآراء ..في إمكانية لعمل فلتر للتعليقات..يمكنك من خلاله الاطلاع على التعليق قبل نشره..تنشر من خلاله التعليقات المناسبة ليك وتحجب الغير مناسب أو إلي إنت شايف إنها متخلفة من متخلفين !!<br /><br />وكون إنك سبت الباب مفتوح للجميع ..المتخلفين وغيرهم..فتستحمل ..لإن هتلاقي ناس ممكن تسبك وتجرحك بجد...وهتلاقي ناس شايفة إن ليها حق الرد ولكن ممكن يكون اسلوبها مش ساعفها ..زي حالي كده..وللأسف هو ده الانترنت...زي ما ليك حق الكتابة والنشر على الملأ ..استحمل ..الرد والنقد..من غير عقد أو نفسيات حساسة..وتعليق يفوت ولا حد يموت<br /><br />دي وجهة نظري..وأعتذر مرة تاني.."

