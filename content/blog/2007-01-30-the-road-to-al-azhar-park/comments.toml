text = "الحبيب مصعب<br />حصل خير..بصراحة أنا مش شايف لازمة لتصنيف التعليقات إلى تعليقات متخلفة وتعليقات بفيونكة ودانتيلة...<br /><br />لإن إلقاء وصف التخلف على أي رأي ناقد أو مخالف يعد إستسهال وفي بعض الاحيان تعالي..وفي الحالتين ضرره أكبر ..يعني لا الواحد يقدر يشوف عيوبه ولا يصلحها ولا يعرف فين الصح من الغلط وبالتالي هيحصل زي ما النظام في مصر ما بيعمل ...شايف كل الناس متخلفة ومش فاهمة ومش مقدرة جهوده في إعمار البلد وإصلاحها..وبالتالي الوضع زي ما إنت شايف النظام عمال يزيد غرور وتكبر وبطش وشايف إن كله تمام ..ومبينغصش على البلد عيشتها غير شوية المتخلفين إلي مش فاهمين نظريات النظام وحكمته...<br /><br />ليك مني كل تحية ..<br />وعلى فكرة أنا بقالي فترة طويلة مبدخلش على النت..ودي أول مرة أعلق فيها على مدونتك<br />بس معلش خبطت فيك المرة دي.."

[[comments]]
author = "مُصْعَب إِبْرَاهِيم"
