text = "تدوينة معدية يا مصعب كالعادة ومش مبعثرة ولا حاجة<br />بس هو نوم المواصلات بيعمل كده وزيادة<br />بالنسبة لحكاية إعلانات حضرموت دي فخلاص بقت مرض بعيد عنك مع إن طعمه زي ما بتقول استغفر الله وخدمته أسوأ لكن ده الطبيعي، لدرجة إني مرة كنت راكبة تاكسي والولد حدف الورقة بسرعة خرافية والتاكسي ماشي بسرعة فعورت وشي بعيد عنك... يعني كمان المطعم ممكن يتسبب في عاهة مستديمة<br />الحاجة التانية علامة الأرنوب دي... بالرغم من إنها علامة أبيحة إلا إن تلت تربع اللي لابسينها مش فاهمين معناها وفاكرينه لوجو بريء... وأراهنك إن الفلحوس اللي قالك إنه عارف هي بتاعة إيه... أكيد فاكرها محل أرانب شهير مثلاُ في إنجلترا ولا حاجة<br />وبالنسبة لسؤال أميرة إنت عرفت اللوجو ده منين... ياريت ماتقلقيش يا أميرة، كويس إنك فعلاً عارفه بدل ما تيجي الشغل يوم لابس تيشيرت من النوعية دي<br />وع البركة"

