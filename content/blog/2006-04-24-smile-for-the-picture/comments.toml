text = "معاك إن الدنيا فيها حاجات كتير بتبكينا، لكن ده ميمنعش إن فيها  حاجات بتضحكنا،بلاش ننظرللجانب المظلم<br />بمناسبه الصور،تخيل نفسك فى رحله ومعاك كاميرا،وصورت واتصورت مع أصحابك،وروحت علشان تحمض الفيلم.......أكتشفت إن الكاميرامفهاش فيلم اصلا ..هتعمل إيه!!أفتكر غضبك مش هيفيد ، أهااا هتضحك فى اللحظه دى هقولك بوصلى علشان الصوره تطلع حلوه..."

