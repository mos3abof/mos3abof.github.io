text = "المشكله ان مفيش حاجه تتضحك لا بره ولا جوةلو بصيت لنفسك حتلاقى حاله ميسرش لا علاقتك مع ربنا كويسه ولا مع نفسك كويسه ومش هتلاقى نفسك اديت اللى عليك فى كل حاجه يعنى من الاخر لو قعدت وفكرت مش هتلاقى نفسك راضى عن نفسك ...<br />ولو بصيت بره هتلاقى البلد حالها زفت )(سورى فى الكلمه) <br />موت واعتصامات واعتقلات وخراب فى كل مكان<br />....<br />معلش  كان نفسى اقلك اخبار احسن من كده بس مش لاقيه<br /><br />بس كويسه انك لسه متفائل بعد دا كله دا غير اللى انا مقلتوش !!!!! <br />يلا بقى اضحك علشان الصورة تطلع حلوة"
