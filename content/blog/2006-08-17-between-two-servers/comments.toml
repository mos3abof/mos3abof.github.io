text = "محمد، وأنا معاك<br /><br />يحيى ، حاضر<br /><br />معتز، ربنا يخليك يا رب<br /><br />محمود، ده كتير أوي عليا..<br /><br />بالنوسبة بقى للأستاذ \"محمد مشرف\"<br />أنا مش فاهم ايه اللي مزعلك؟!<br />ومع ذلك يا سيدي  هأنزل لمستواك وأرد عليك..<br />أولا : مين قال لك إني بأشتغل على ويندوز بس؟!! أنا باتعامل مع ماك و لينوكس و قصص أخرى<br /><br />ثانيا: أنا بأستخدم ويندوز في المكتب علشان النيتوورك اللي الدنيا معمولة عليها، و بتوع الـIT مانعيني من استخدام أي حاجة تانية غير ويندوز<br /><br />ثالثا: أنا مش \"متعصب\" زي ما فهمت من تعليقك، أنا بأحترم جدا جدا عقلية بيل جيتس، وهو فعلا عمل شيء مش طبيعي و يخليه بطل، بس أنا بأكره بعض تصرفاته مش أكتر<br />ومش بأكره كل منتجات microsoft<br />بأكره فيها حاجات وحاجات بأحبها<br />ولوجهة نظر منطقية تماما <br />مش زي ما أنت فاهم!!<br />يا رب تكون وصلت لك"

