[[comments]]
author = "محمد السيد..مش حاسكت"
date = "2006-08-17T18:20:00.000+02:00"
avatar_url = "https://img1.blogblog.com/img/b16-rounded.gif"
profile_url = "https://www.blogger.com/profile/15123433931771567833"
comment_url = "https://mos3abof.blogspot.com/2006/08/site-my-sight.html?showComment=1155831600000#c115583162049330270"
text = "إيه يا عم .... <br /><br />إنت مصر يعني ....؟؟ <br /><br />هم يلعبوا ويتفسحوا وحفلات وأغاني وهزار  ... وانت اللي مطحون وغلبان ومشدود .... وشايل الهم كله .... ؟؟؟<br /><br />مش ده كان كلامك .... ؟؟  مااااااشي ..طيب والله أول ما أشوفهم لأقولهم ...... ماشي ... !!!<br /><br />كمان أنا مش راضي اقول لهم .... إنت قعدت تدعي عليهم .... و كنت حتاكلهم .... بس أهه قلت بلاش ...<br /><br />إوعوا تصدقوا .... <br />نتكلم جد بقي .... الحقيقة أكثر واحد كان باين عليه التعب حقيقي يوم الحفلة ... <br />حتي كلهم اعترفوا بكده وفعلا نقل الموقع والشغل المبذول ... يقول إنك إنت عبقري يا ابني ..... وسيبك من أي حاجة تانية ...<br /><br />أحلي حاجة إنك تشوف حاجة تعبتك جدا فيها أوي وهي شغالة .... والناسي كلها بتشكر فيها ....<br /><br />بس برضه أنا عند رايي إنك لازم تاخد راحة وتأجز شوية .... مش كله شغل كده يعني ... اطلع من الموووووود .... <br />وأحسن راحة شد حيلك و تعالي انت والهواري علي هنا ... وانسي الدنيا كلها واللي فيها <br /><br />يالا سلام"
