text = "على جمر ٍتسير ُبى َ  الليالى ..ولا نور ُأمامى أو ورائى<br />أنا لا أستريح ُ على فراشٍ وفى جنبىّ هم ُكربلائى<br /><br />لا تحزن يا اخى وسيأتى الفجر وستأتى معه الحياة الأجمل الجديدة<br />أعانك الله على شروخ روحك فهو الوحيد المعين فى تلك الظروف النفسية الصعبة <br /> وزى ما انت كاتب يا مصعب فى <br />التصميم \"ربما يكون السقوط بداية لحياة جديدة\"<br /><br />:وتذكر دائما<br />إن ما قدرتش تضحك<br />ما تدمّعش ولا تبكيش..<br />وإن ما فضلش معاك غير قلبك<br />إوعى تخاف <br />مش هتموت ... هتعيش<br />:)"

