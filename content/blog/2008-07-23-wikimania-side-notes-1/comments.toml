text = "بالرغم من إني قعدت يومين زيادة بعد الويكيمانيا، إلا إني لا نزلت بحر، لإقتناعي الشديد إن بحر إسكندرية ما يتنزلش أصلاً وخصوصاً في الصيف حيث المصيفين القادمين من القرى واتفرج بقى على البحر والرملة والمحشي واللب والزبالة.. كله كومة واحدة... وسلم لي على شارع خالد ابن الوليد<br />ولا حتى شربت خروب من عند سامي.. لأني معديتش هناك، لكن بصراحة أكلت جمبري وعمي فسحني شوية الحمد لله... وبعدين الأجمل من كده كفاية يا مصعب إستمتاعنا بالويكيمانيا نفسها... كانوا ثلاث أيام تحفة بصراحة."

