text = "اتصورت مع جيمي ويلز، الله يسهله يا سيدي<br /><br />للأسف ماقدرتش أحضر المؤتمر، أنا عارف إني فاتني حدث كبير، ويمكن ماعرفش أحضره لبقيت عمري، بس نقول ايه، قدر الله وماشاء فعل.<br /><br />مش عارف ليه التغطية الإعلامية للمؤتمر ضعيفة جدا، سواء محليا أو عالميا، مع إني شايف إن الويكيبيديا و أخواتها من أهم المواقع اللي موجودة علي الانترنت حاليا ويمكن علي مدار التاريخ الصغير للشبكة<br /><br />الموضوع مش مجرد موسوعة، الويكيز دي مبدأ في الحياة، أعتقد كانت تستحق مننا أكتر من كده<br /><br />بانتظار تفاصيل عن الموضوع علي أحر من الجمر، وتسرني معرفتك<br /><br />أخوك<br />أحمد علي ، وبكتب في الويكيبيديا العربية تحت اسم premiero"
