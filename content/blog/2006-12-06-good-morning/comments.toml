comment_url = "https://mos3abof.blogspot.com/2006/12/blog-post_06.html?showComment=1165475880000#c8129030046284943940"
text = "تعرف يا مصعب انا برده اتخرجت بقالي سنة ونص تقريبا اهو وعايش في نفس الدوامة السودة ....اللي بعمله كل يوم بعمله بكرة وبعده وبعد بعده ...حتى الناس اللي بشوفها في الشارع هما هما الناس كل يوم  ...في الشركة القديمة الناس اللي واقفين على محطة الأتوبيس عارفين بعضهم وكل الناس عارفة ده شغال في شركة ايه وده شغال في مكان ايه ...لدرجة إن لو الأتوبيس فاتني كانوا يقولوا لي الأتوبيس فاتك ...واللي ييجي متأخر يقولي اتوبيسي جه ولا لسه .<br /><br />قمة الكوميديا إني كنت بسمع نفس الحكاوي جوه الأتوبيس يوميا ..عم عربي اللي عمال يحكي حكاوي زمان ...والرغيم اللي كان بمليم ...والشوارع اللي كانت فاضية وتخاف تمشي فيها دلوقتي بقيت ما تعرفش تحط رجلك فيها ...والصحاري اللي اتبنت عمارات وشوارع وطرق .<br />وعم السيد سواق الأتوبيس الغلس اللي كل يوم يهزر مع عسكري المرور اللي مستغلس دم عم السيد ومش معبره وكل يوم عم السيد يسلم عليه وده يطنشه ورغم الطناش فهو ما بيغيرش روتينه كل يوم.<br /><br />تعرف حتى عارف بالظبط امتى الموظفين بيفتحوا الشبابيك بتاعة الأتوبيس ...يعني عمرو مثلا بتاع قسم التصدير لازم يفتح الشباك قدام جامع القائد إبراهيم في محطة الرمل يوميا...وأميرة بنت الحاج عربي اول ما نوصل محرم بيك لازم تقوله لو سمحت اقفل الشباك الهوا جامد .<br /><br />نفس الروتين هو هو ....لا تغييييييير"

