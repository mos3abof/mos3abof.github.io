author = "محمود محمد حسن"
date = "2006-12-07T08:18:00.000+01:00"
avatar_url = "http://2.bp.blogspot.com/_AICs_qYdeAU/ShQ7-5dEytI/AAAAAAAAARE/zQXsd2ejMwY/S220/ADV+copy.jpg"
