text = "حلوة قوي يا مصاعيبو، انت على طول كده جاي التايهة يعني مش عارفين نقول حاجة ياراجل<br />الا قول لي يا مصعب هي التكنولوجيا دي ازاي؟<br />هو سؤال غريب بس بيخطر على بالي كل ما اشوف منك موضوع مرتبط بالتطنولوجيا او اشوفك بتظبط حاجة<br />يلا بلاش نق بقى اصلك بتنفع برضه"

