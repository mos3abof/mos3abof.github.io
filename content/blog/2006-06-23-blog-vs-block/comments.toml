text = "تعرف يا مصعب <br />واضح إننا لازلنا متشابهين<br />أنت الكمبيوتر واكل دماغك وبتشوف كل حاجة من خلال مصطلحاته وتعريفاته<br />وأنا نفس الوضع بس بدل الكمبيوتر تلاقي (المدنية)<br />ربنا يصلح حالي وحالك ويهديني ويهديك<br />بفكر أجيب الشباب اللي أنت واحشهم ونزورك في الشغل لو الفكرة معقولة قلي وقلي على مواعيدك بالتقريب ..أكيد دقتك في المواعيد يدوب لحد أقرب خمس ساعات"
