text = "عزيزي الباشمهندس أحمد حسان<br />حسيت أنه لابد أن أرد على حضرتك في تعليق مستقل لأني بأحترم حضرتك جدا جدا ولما لك من مكانة في قلوبنا كلنا والله<br /><br />أنا مبسوط جدا جدا إن المدونة  عجبت حضرتك، ودي شهادة أعتز بيها<br /><br />أنا مقتنع بكلام حضرتك جدا، بس لي تعقيب صغير، <br />الحضور والشغل فعلا هما الجناحان، ولكن الجناحان وظيفتهما حمل الجسم اللي هو المؤسسة نفسها ورسالتها وقيمها مبادئها،<br /><br />مشكلتنا إن سؤال \"ليه؟\" دايما غايب عن أذهاننا، هو احنا مهتمين بالحضور ليه؟<br />علشان زي ما حضرتك قلت نحافظ على معيار صادق لمدى إنتاجية الأفراد أو المجموعة<br />من هنا أنا لو مدير ولقيت طريقة تانية تحقق نفس الهدف وفي نفس الوقت تريح الناس أو على الأقل تحسسهم بأهمية ده هأتبعها مباشرة<br />في مليون نظام حضور وانصراف ونظم ساعات معتمدة والخ معمولة علشان كده :)<br /><br />بالظبط زي منتج برمجي كبير فاللي بيعملوه مهتمين جدا بتأمينه ضد الاختراق (security) ولما اهتماهم بالأمن زاد، ابتدى يقفل الدنيا في وش البرنامج نفسه علشان كده بيعرض نفسه للاختراق! فما عادش في برنامج علشان اعتبارات أمنية! في حين إن الاعتبارات الأمنية المفروض تحمي البرنامج مش تقتله<br /><br />أنا سعيد جدا بمرور حضرتك وياريت حضرتك تنورنا تاني <br />وأشكر حضرتك بشدة على الرابط اللي في مدونتك"

