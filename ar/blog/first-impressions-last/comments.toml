text = "اول مره انا الحقيقه مش فكراها.. وبيني وبينك يا مصعب اعتقد أنك من كثر ما كنت هادي، انا ما اخذتش انطباع أول، بس الي اقدر أقولك أن الي حصل معايا أني سمعت عنك فكنت حبه اتعرف واشوف أنت فعلا زي ما بيحكوا عنك؟؟. <br />كانت ياسمين الي قالت عنك من أحسن الناس الي انا قبلتها.. ولأني ما بأخذش انطباع عن حد من حد، فبصيت لك بنفسي، واقتنعت أنك فعلا زي ما كل الناس ما بتقول one of the best، <br />ويمكن انطباعي الأول كان على أسمك D:  أنا أول مره اعرف حد على اسم هذا الصحابي الجليل. يمكن استغربته<br />ممكن أقول.. ان انطباعي الحالي عنك،أنك بني آدم ممتاز، واني بتساءل كثير بيني وبين نفسي هل في انسان لا خلاف عليك... وللأمانه.. أعتقد أنك لا خلاف على سمو أخلاقك يا مصعب... بس لسه قدامك كثير من خبرات الحياة لتكتسبها، ونحن طبعاً كذلك :)"

