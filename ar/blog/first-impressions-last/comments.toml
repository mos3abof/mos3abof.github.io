text = "باحب يا مصعب جدا لما تشركني معاك ففي جنانك واخترعاتك وافكارك التي أعتبرها من عالم آخر غير عالمي \"الرزين\" ال باشتغل فيه وأحياه فعلا، وبالرغم اننا زملاء في مؤسسة واحدة لكن لكل منا طريقته في الحياة وفي الشغل كمان.<br />أجي لموضوعك الاساسي وهو انطباعي عنك: بصراحة كان احساس انك زي أبني هو أكتر الأحاسيس المسيطرة عليا-رغم ان الفارق بيننا ليس كبيرا بالدرجة التي تجعلني أمك فعليا- لكن كنت حاسة تجاهك بالتسامح والغفران وخاصة لما كنت بتجنني وتتأخر عليا في المهام ال كنت باطلبها منك في دورة التطوع الالكتروني..ومادمنا تكلمنا عن الدورة دي أحب أقول انه رغم عمرك الصغير الذي لا يتجاوز العشرين الا انك كنت مدرب ومعد مادة دورة التطوع الالكتروني اكتشاف ومهارة على شبكة اسلام أون لاين.نت وهذا في رأيي دليل على عبقريتك وشطارتك(ما شاء الله عليك)..نفسي زياد يطلع زيك مختلف عن من حوله..باحب اختلافك ده..كمان باحب مدونتك وباحب الجمل ال بتحطها على الماسينجر..وادعو لك مزيد من التقدم.<br />ولا تنسى كليتك ومذاكرتك ..لأنك تستحق الكثير فلا تفسده بهذه التفاصيل الصغيرة..وربنا معاك:)<br />كوثر الخولي-أم زياد"

