text = "السلام عليكم و رحمة الله و بركاته<br />شوف يا عم مصعب انا ماقابلتكش قبل كده - لكن اتمنى طبعا - و اكيد ماحصلش بينا اي حوار و اي انطباع هاقوله هايكون نابع من مدونات اصدقائك ثم مدونتك العامرة بـــ.........ما علينا ندخل ف الانطباع<br /><br />انسان ..ذكي جدا .. عملي جدا.. عندك احساس عالي بالمسئوليه..حساس بشكل استغفر العظيم.. مش بتحب ال\"لوك لوك\" و مابتطلعش الكلام بسهوله و مش لازم تكون بتقوله لحد بتحبه اد ما بتثق فيه ...اي ان الثقه عندك ضروريه جدا .. متدين و اول مرة اشوف واحد شكله طيب و يعرف ربنا و من جواه يطلع برده طيب و يعرف ربنا ..و بما انك مش لوك لوك اذا العيبه مش بتطلع من بقك .. امممممم كفايه كده <br />لما نتقابل ان شاء الله ابقى اديك بيان تفصيلي تعمله بلوفر ...هههه<br />فكرة الانطباع جميييييييييييله و بعد اذنك و بسيف الحياء هاسرقها هاسرقها .....بس اما نهى ترضى عني و نعمل مدونه بقى ان شاء الله قول يا رب <br /><br />the wall"

