comment_url = "https://mos3abof.blogspot.com/2006/11/blog-post_09.html?showComment=1163321220000#c4526821373926423689"
text = "ميرسى يامصعب لينك بعت لى لينك التدوينة زى كل الناس اللى عندك مع انى .. (مش موجودة<br /><br />على فكرة احنا قعدنا قبل كده فى قاعدة اوف لاين وقلت رأيى بس مش عارفة انت فاكر ولا لأ<br /><br />كان يوم اعلان خطوبة براء صاحبك ودعاء، كان يوم عالمى كل الناس فى عشرينات بتقول رأيها فى بعض وكان يوم أعلبه كذب خالص، لكن انت من الناس اللى اتمنيت انها تستثنى رأيى فيها من المنظومة الجميلة دى<br /><br />ويومها استفلت تعبير شهير لشيرين مجدى عن أكلة بتحبها ومش تقدر تستغنى عنها   وقلت مصعب ده اختيار غير نهائى بالنسبة لى ولأى حد بيفهم<br /><br />امم .. اول يوم بقى شفتك كنت لسه راجعة عشرينات عشان اشتغل مع استاذ احمد نصر فى صفحة الانتخابات وكان كل شوية يبص ورايا، فلفيت اشوف ايه ورايا ده لقيتك انت وقاعد على الشباك وراسك كلها فى الكمبيوتر مش عارفة ازاى، وحسسنى انك فى ايدم مصير مصر وكل شوية يقولك .. ايه الاخبار يا مصعب؟ خلصت<br /><br />وبدأت افهم وجهة نظره لما عرفت ان اسمك كده وانك مسئول البرمجة فى الصفحة، وفضلت طول الاسبوع الاول فى  معرفتنا اقولك .. خلصت يامصعب الصفحة ؟ .. ، وكنت طول الاسبوع الاول وكنت باتضايق جدا،  وأنا كنت باستغرب برضه فى الاسبوع ده انك اخوان وكل ما اكلمك عن حاجة بالسياسة او موقف الاخوان فى الانتخابات تقولى انا اخوان بس مش لى علاقة بالسياسة<br /><br />وفى اول يوم معرفة بينا برضه قمت تصلى بينا وسالت دعاء اشمعنى هو يعنى قالت لى ده ما شاء الله عليه حافظ كتير اوى؟ .. <br /><br />واحنا بنصلى قعدت افكر (للأسف دى عادة زى الزفت فى عشان كده باحب يبقى لى امام) يا سلام يعنى الواد اللى صوته حلو ده فى القرآن هو الامام وهو اللى ،  مالك روح الصفحة دلوقتى وفى اولى كليه بس!!، وكنت ايانها مكتئبة اوى وقلت فعلا اللى عايز حاجة بيعملها وفرحت اوى بالنموذج اللى كنت شايفاه  فيك اوى ساعتها، وقلت يومها وانا باصلى برضه) انك شبه يوحنا المعمدان فى قصة سالومى لمحمد سلماوى ، القديس اللى الهانم سالومى رقصت نخب الحصول على راسه<br /><br />بعد الشر عليك، وبعيد عن كلكعتى، وعلى فكرة انت عندك صور احلى تليق على الموضوع اكتر من دى<br /><br />انا كتبت انطباعى الاول بس عشان انت طلبت كده ومش عارفة لو كنت طلبت غيره كنت هاقولك ولا ..<br />وكمان مش هاعمل زى الناس المتطوعة اللى فوق لأنى باتعب من الكلام ده وباخاف اقوله او يتقال لى ، ومش عارفة برضه انت يهمك رأينا فيك اوى ليه؟ عايزة ايعتلك وش بيضحك بس انت عارف قدراتى التقنية بس يارب توصل لك الضحكة ومعاها كمان وردة .. سلام"

