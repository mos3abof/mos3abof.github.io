text = "معاك انهم فعلا كانوا عاملين حاجز كبير بينا وبين المشاكل(عن تجربة بعد وفاة أبى اللهم ارحمه وارحم اموات المسلمين) وكفاية ان الواحد مكنش شايل هم لاى حاجة فى الدنيا لانه عارف ان فى حد شايل عنه عبء التفكير فى الحاجات الكبيرة، لكن برضه بلاش نظرة الياس دى سبحان الله ربنا فعلا لا يريد لنا الا الخير وافتكر دايما ان ربنا باعد بينك وبينهم(مبحبش كلمة موت لانى مش حاسة ان ابى ماتن حاسة انه مسافر شوية وراجع تانى ) علشان اكيد هو بيحبك وعايزك تعتمد على نفسك اكتر ممكن، بص حاول تشوف النعم اللى ربنا رزقك بيها من اول وفاتهم بجد هاتلاقى انه كان فى خير كتير ليك لان ربنا بيحبنا ومش ممكن يعملنا حاجة تضرنا، وربنا يقدر لك الخير حيث كان بس خد بالك من اخواتك اوى وادعى ربنا كتير اوعى يسرلك امرك ويهديك لما يبه ويرضاه. واعتذر عن الاطالة."

