text = "لغاية أمبارح كنت متعاطفة جدا مع القطة وكنت بفكر أزاي ممكن نساعدها بس اكتشفت أنها هي اللي بتحط نفسها في مواقف صعبة و هي اللي غاوية مشاكل ... يلا سبحان مغير الأحوال من حال إلى حال.<br />أحكي الحكاية اللي خلت رأي يتغير علشان تشركوني ..<br />أمبارح بالليل كنت   رايحة مشوار بس طلعت بالعربية وبعد شوية سمعت صوت غريب في العربية و وكمان لاحظت ان مؤشر البنزين بقى قليل  بالرغم من أني لسه ممونة !! فركنت على جنب وفتحت الكبوت  فلقيت القطة صحبيتنا قاعدة جوه الكبوت وعمالة تلعب و من اللعب أقطعت خرطوم البنزين و بعدين اتزنقيت ومعرفتش تتطلع تاني من الكبوت بس طبعا يومي باظ ومشواري اتلغى و رحت للمكنيكي .. <br />على العموم لو لسه عيزين تطمنوا   على القطة فهي كويسة جدا وأنا اللي دمي نشف أمبارح من الخضه .."

