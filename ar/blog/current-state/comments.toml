text = "قطة اختي......بتلف طول الليل في اوض البيت بتبكي بحرقة و بصوت عالي بكاء مريير و طويل.<br /><br />لانها ببساطة وحيدة بلا رفيق<br /><br />بنصحا بالليل و اختنا صاحبة القطة بتنام <br /><br />اختي الاكبر يتقعد طول الليل تلعن و تشتم في القطة و صاحبة القطة و سنينها على نومها التقيل بدون ما تشوف صرفة لاقطتها و بتبقى عاوزة تحدف القطة بحاجة<br /><br />و القطة بتبكي بكائها الطويل المرير<br /><br />و لما نصحى الصبح تاخدنا الحياة و شغلنا و روحنا و مجينا <br /><br />و اختي صاحبة القطة ترجع تلعب بالقطة شوية (مش مع القطة) و يتكرر اللي بيحصل كل ليلة<br /><br />صحيت الفجر <br /><br />خدتهل في حضني و اديتها كورة تلعب بيها تلهيها شوية عن الامها و وحدتها<br /><br />دفيت و نامت جمبي بهدوء الاطفال<br /><br />كل اللي كانت محتجاه هو الدفا !!!"

