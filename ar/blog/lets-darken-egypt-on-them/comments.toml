text = "سذج \\ سطحيون <br />محاولات ساذجه لاتخاذ مواقف سطحيه<br /><br />محاولات طفوليه لبعد غير مدرووس او منظور<br /><br />طبيعى<br /><br />حماس الأطفال <br />وغرور العرب <br />ولهجة العارف<br />ولغة الواثق<br />هذه سمة هذا الجيل الخرب<br /><br />ما من جديد <br />هذا جيل الدمى الورقيه وليست الخشبيه<br />على الاقل كانت الدمى الخشبيه يصعب كسرها<br /><br />ولكن هذه ما اسهل ان تذوب وتختفى وتنسى <br /><br /><a href=\"http://tryinto.wordpress.com/\" rel=\"nofollow\">فى الرد على هذا المقال</a>"

