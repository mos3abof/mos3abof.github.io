text = "انا نفسى نكون واقعيين فى كلامنا ويوم منقول هانعمل حاجه نبقى دارسين ابعدها كويس ومدى تاثيرها ومدى استجابة الناس ليها <br />معرفش ليه بحس انكم بتفكروا تفكير طفولى او ساذج يعنى كان ممكن تقولى نروح نعتصم مع القضاه او نعمل حملات توعيه للناس ونبينلهم الحقيقه لو فكرتوا كويس هتلاقوا حاجات ايجابيه ممكن تعملوها <br />سؤال اخير ايه الفايده او الحاجه الايجابيه اللى ممكن تحصل لما الناس تطفى النور(دا بفرض ان الناس فعلا هتعمل كده)<br />عاوزين واقفه جامده واقفه رجاله مش تتطفى النور وانتو قاعدين مستريحين فى بيوتكم والناس بره بتتبهدل<br />اكبروا شويه بقى"
