text = "عودين درة وحياتك..<br /><br />لا معلش.. <br /><br />خليهم تلاتة.. أنا وانت ودعاء.. <br /><br />ولا اربعة<br /><br />انا وانت ودعاء ودريني<br /><br />خمسة<br /><br />انا وانت ودعاء ودريني ورفعت<br /><br />ستة <br /><br />انا وانت ودعاء ودريني ورفعت وندا<br /><br />سبعة<br /><br />انا وانت ودعاء ودريني ورفعت وندا وفؤاد<br /><br />تمانية<br /><br />انا وانت ودعاء ودريني ورفعت وندا وفؤاد وأحمد زين<br /><br />تسعة.. <br /><br />لا لا بقولك إيه.. كدة المحصول هيتعبنا واحنا بنلمه آخر الموسم.. <br /><br />بص يا عم.. احنا نروح نزرع درة في غيط فاضي بعيد عن غيط الكمون.. ولما نبقى نزهق  من الدرة نبقى ناخد بعضنا نقعد شوية في الكمون (وبالمرة نجيب معانا شوال ولا حاجة عشان بحب الكمون على طبق الفول) ونرجع تاني نقعد في الدرة مع بعضينا.. <br /><br />والحب ولع في درة يا مصاعيبو.. <br /><br /><br />* ملاحظة انسانية.. <br /><br />باعتبارك عايز تبقى غيط كمون.. فأبشرك إن في معنى قبيييييييييييييييييييييييح موت.. <br /><br />اتمنى محدش يفهمنا غلط يا حبيبي.. ولا ايه يا رفعت<br /><br />براء من الصعيد بعد صلاة الفجر من السايبر اللي جنب الجامع.. والجامع جنب الكتيسة.. والكنيسة جنب الشقة.. والشقة في قنا.. قريبة موت.. فردة كعب.. من الخرطوم.. <br /><br />نيها نيها نيها.. <br /><br />كان نفسي أضحك كدة من زمان.. <br /><br />يوووووه.. <br /><br />السايبر كله اتفرج عليا.. <br /><br />سلام يا عم انا وريا امتحانات.. عايز ألحق أذاكر.. <br /><br />وتتكون عناصر الصحيفة البنائية من 6 عناصر هي..<br /><br />الحروف<br />العناوين<br />الصورة<br />الرسوم<br />الألوان<br />الفواصل<br /><br />مذاكر جدا والله.. ربنا يستر.. ادعيلي.. وكلمني اول ما تشوف ردي.. <br /><br />يووووه نسيت موبايلي في الشقة ودعاء هتكلمني اكيد بعد ما تصلي الفجر.. <br /><br />سلام ياعم<br />براء"

