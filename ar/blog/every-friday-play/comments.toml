text = "هى جت على صلاة الجمعة بس ، ما تيجوا نفتكر صلاة العشاء فى اول يوم عيد الفطر ن بعد شهر كامل من الوحانيات ن المشكلة اننا بنعتمد فى علاقتنا بربنا على المؤثرات الخارجية انها ترجع لنا روحانياتنا والمعروف ان المؤثرات دى مفعولها بيروح بعد فترة قصيرة جدا.<br /><br />اللهم رد المسلمين الى دينك ردا جميلا"

