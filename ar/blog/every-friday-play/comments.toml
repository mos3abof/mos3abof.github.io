text = "الموضوع هصوره بطريقه هايله،وبمناسبه العدد اللى بيكون موجود فى صلاه الجمعه ومبتلقيش ربعه فى صلاه العصر من نفس اليوم،ده لأن الناس بيعتبروا ان صلاه الجمعه فرض مقدس فكل واحد بيلم عياله وقرايبه وهو رايح يصلى،وبعد انتهاء الصلاه ،يعود الحال كما كان ،وكأنهم أقاموا الفروض الخمسه فى فرض واحد،و اليوم انتهى  ؛وكل جمعه وأنت طيب"
