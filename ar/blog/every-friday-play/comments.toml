[[comments]]
author = "Nohaz"
date = "2006-04-21T20:51:00.000+02:00"
avatar_url = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjIL2Z6FgqS2BzmD5surOJddf86weillgt5JtPyrgYF4iz2gB7mG4eN1loo1l0iKz2klyPj0rW39wWI9ANzGY5FQsPPr-Y2fjZ6RjrO2ZtfS2SOIXKeQUD1jMkHpvSHlUY/s113/lip-synching_1710116i.jpg"
profile_url = "https://www.blogger.com/profile/14313688156868197076"
comment_url = "https://mos3abof.blogspot.com/2006/04/blog-post_21.html?showComment=1145645460000#c114564547498485805"
text = "السلام عليكم مصعب اخويا العزيز جدا جدا<br />فعلا ده واقع و انا استغربت ان و انا في ميدان السيدة عائشة الصلاة تقام لكن معظم الناس لم تتحرك من مكانها بالنسبة لي لاني لا اعلم هل هناك وضوء سيدات و مكان للسيدات ام لا قلت سأصلي حين اصل للجامعة بعد قليل <br />لكن الرجال ما حجتهم؟<br />لو قرأت موضوع المكتوب من شوكش في مدونته<br />ستجد ان إضاعة الصلاة هي بداية الاختلال في شخصية الإنسان<br /><br />و ستجد اني كتبت من قبل عن أهمية الجانب الروحاني في شخصية الأنسان و كعامل مساعد له لتحقيق ذاته و توفير احتياجاته سواء النفسية و المعنوية او المادية<br />لكن اخي العنوان مع الصورة اعطاني احساس انك تقصد ان صلاتنا يوم الجمعة مسرحية نمثلها دون ان تنبع من قلوبنا<br />كان ممكن تغير الصورة لصورة سوق الجمعة <br /><br />ولا اية رأيك؟"

