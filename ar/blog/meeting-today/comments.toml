text = "هههههههههههه<br />فكرتنى بالذي مضي .... فين ايام الاجتماعات ؟؟؟ والله كانت أيام هنا<br /><br />كنا بنجتمع علشان نتطمن على أحوال بعض و نرتب هنروح فين الرحلة الجاية و فلان يقول انه مضايق علشان فلانة و هي بتسلم عليه الصبح ماكانتش مبتسمة زي عادتها و هكذا و هكذا و مش مشكلة لما يبقى فيه يوم اسمه اجتماع<br /><br />دلوقتى بقى في الشغل الجديد رجع للاسبوع ايامه و بقينا بنتحسر على اليوم اللى بتتكلم عنه ...<br />يا عم مش بتسرح و تفعد تشخبط في الورق زي ماكنا بنعمل ...طيب خير<br />طب بتقعد تكتب جمل للى جنبك في الورقة و تخليه يضحك في وسط الاجتماع ....هههههههههه<br /><br />طيب بتقعد تلعب في الموبايل من تحت الترربيزة وترن لزمايلك ...غلاسة هههههههه<br /><br />أمال بتعملوا ايه؟؟؟؟<br />أه ...اكيد بتقعدوا تبصوا لبعض و رئيس الاجتماع يقول لكوا حد عنده تعليق ؟؟ حد عنده اي ملاحظة ؟؟؟ و طبعا لا حياة لمن تنادي ...صم بكم عمي <br /><br />احنا نايمين اصلا ...يلا لم ورقك و  داتاشوهك و  سمعنا سلامو عليكوا .............احنا جعايييييييييين و مدام فوقية سايبة عيالها عند ام محمد و لو اتأخرت ابو مجدي هيوريها<br /><br />هههههه<br />هو ايه اللى انا كتبته ده كله ...ماعلينا هو احنا كنا بنقول ايه ؟؟؟الاجتماعات ؟؟؟<br /><br />يا عم عيش  الاجتماعات قبل ما ييجي اليوم اللى ماتلاقيهاش <br /><br />تحياتي"

